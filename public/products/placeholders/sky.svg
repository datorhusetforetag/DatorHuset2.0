    <rect x="103" y="189" width="178" height="250" rx="4" fill="#d9d6df" />
    <g stroke="#ffffff" stroke-width="1" opacity="0.5">
      <line x1="121" y1="366" x2="281" y2="366" />
      <line x1="121" y1="406" x2="281" y2="406" />
      <rect x="115" y="213" width="40" height="70" rx="3" fill="none" />
    </g>

    <rect x="115" y="165" width="59.333333333333336" height="14" rx="3" fill="#0b0a0f" stroke="#ffffff" stroke-width="0.8" />
              <rect x="119" y="176" width="51.333333333333336" height="3" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="119" y="176" width="51.333333333333336" height="2" rx="1" fill="#38bdf8" /><rect x="180.33333333333334" y="165" width="59.333333333333336" height="14" rx="3" fill="#0b0a0f" stroke="#ffffff" stroke-width="0.8" />
              <rect x="184.33333333333334" y="176" width="51.333333333333336" height="3" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="184.33333333333334" y="176" width="51.333333333333336" height="2" rx="1" fill="#38bdf8" /><rect x="245.66666666666669" y="165" width="59.333333333333336" height="14" rx="3" fill="#0b0a0f" stroke="#ffffff" stroke-width="0.8" />
              <rect x="249.66666666666669" y="176" width="51.333333333333336" height="3" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="249.66666666666669" y="176" width="51.333333333333336" height="2" rx="1" fill="#38bdf8" />

    <!-- Bakre fläkten, sedd från sidan -->
    <rect x="83" y="209" width="14" height="78" rx="3" fill="#0b0a0f" stroke="#ffffff" stroke-width="0.8" />
    <rect x="93" y="213" width="3" height="70" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
    <rect x="93" y="213" width="2" height="70" rx="1" fill="#38bdf8" />

