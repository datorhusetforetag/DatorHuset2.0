    <g opacity="0.55">
      <circle cx="55" cy="220" r="44" fill="#0b0a0f" />
      <circle cx="55" cy="220" r="41" fill="none" stroke="#38bdf8" stroke-width="7" filter="url(#glow-sky)" opacity="0.9" />
      <circle cx="55" cy="220" r="41" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="55" cy="220" r="36" fill="url(#fanfill-sky)" />
      <g stroke="#3a3545" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M67.3 220.0 Q85.5 224.6 83.3 239.4" /><path d="M62.7 229.6 Q70.4 246.7 57.5 254.2" /><path d="M52.3 232.0 Q43.7 248.7 29.8 243.3" /><path d="M43.9 225.3 Q25.6 229.1 21.1 214.8" /><path d="M43.9 214.7 Q29.6 202.6 37.9 190.3" /><path d="M52.3 208.0 Q52.7 189.3 67.6 188.1" /><path d="M62.7 210.4 Q77.6 199.1 87.8 209.9" /></g>
      <circle cx="55" cy="220" r="9.68" fill="#16131c" stroke="#2c2834" stroke-width="1.5" />
    </g>
    <g opacity="0.55">
      <circle cx="55" cy="352" r="44" fill="#0b0a0f" />
      <circle cx="55" cy="352" r="41" fill="none" stroke="#38bdf8" stroke-width="7" filter="url(#glow-sky)" opacity="0.9" />
      <circle cx="55" cy="352" r="41" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="55" cy="352" r="36" fill="url(#fanfill-sky)" />
      <g stroke="#3a3545" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M67.3 352.0 Q85.5 356.6 83.3 371.4" /><path d="M62.7 361.6 Q70.4 378.7 57.5 386.2" /><path d="M52.3 364.0 Q43.7 380.7 29.8 375.3" /><path d="M43.9 357.3 Q25.6 361.1 21.1 346.8" /><path d="M43.9 346.7 Q29.6 334.6 37.9 322.3" /><path d="M52.3 340.0 Q52.7 321.3 67.6 320.1" /><path d="M62.7 342.4 Q77.6 331.1 87.8 341.9" /></g>
      <circle cx="55" cy="352" r="9.68" fill="#16131c" stroke="#2c2834" stroke-width="1.5" />
    </g>
    
