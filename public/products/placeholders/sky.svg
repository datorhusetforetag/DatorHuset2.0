    <g opacity="0.55">
      <circle cx="55" cy="88" r="44" fill="#0b0a0f" />
      <circle cx="55" cy="88" r="41" fill="none" stroke="#38bdf8" stroke-width="7" filter="url(#glow-sky)" opacity="0.9" />
      <circle cx="55" cy="88" r="41" fill="none" stroke="#38bdf8" stroke-width="3" />
      <circle cx="55" cy="88" r="36" fill="url(#fanfill-sky)" />
      <g stroke="#3a3545" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M67.3 88.0 Q85.5 92.6 83.3 107.4" /><path d="M62.7 97.6 Q70.4 114.7 57.5 122.2" /><path d="M52.3 100.0 Q43.7 116.7 29.8 111.3" /><path d="M43.9 93.3 Q25.6 97.1 21.1 82.8" /><path d="M43.9 82.7 Q29.6 70.6 37.9 58.3" /><path d="M52.3 76.0 Q52.7 57.3 67.6 56.1" /><path d="M62.7 78.4 Q77.6 67.1 87.8 77.9" /></g>
      <circle cx="55" cy="88" r="9.68" fill="#16131c" stroke="#2c2834" stroke-width="1.5" />
