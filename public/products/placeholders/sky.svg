    <path d="M199.16 254 C 215.16 216, 295.15999999999997 216, 315.15999999999997 183" fill="none" stroke="#08070b" stroke-width="9" stroke-linecap="round" />
    <path d="M209.16 262 C 235.16 228, 325.15999999999997 228, 343.15999999999997 183" fill="none" stroke="#08070b" stroke-width="9" stroke-linecap="round" />

    <!-- Processorkylarens pump -->
    <circle cx="185.16" cy="276" r="33" fill="#eceaf0" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="185.16" cy="276" r="24" fill="none" stroke="#38bdf8" stroke-width="8" filter="url(#glow-sky)" />
    <circle cx="185.16" cy="276" r="24" fill="#0b0a0f" stroke="#38bdf8" stroke-width="3" />
    <circle cx="185.16" cy="276" r="10" fill="#38bdf8" opacity="0.5" filter="url(#glow-sky)" />
    <circle cx="185.16" cy="276" r="6" fill="#38bdf8" opacity="0.9" />

    <rect x="244.68" y="211" width="7" height="92" rx="1.5" fill="#eceaf0" stroke="#ffffff" stroke-width="0.8" />
              <rect x="244.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="244.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" /><rect x="254.68" y="211" width="7" height="92" rx="1.5" fill="#eceaf0" stroke="#ffffff" stroke-width="0.8" />
              <rect x="254.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="254.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" /><rect x="264.68" y="211" width="7" height="92" rx="1.5" fill="#eceaf0" stroke="#ffffff" stroke-width="0.8" />
              <rect x="264.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="264.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" /><rect x="274.68" y="211" width="7" height="92" rx="1.5" fill="#eceaf0" stroke="#ffffff" stroke-width="0.8" />
              <rect x="274.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" filter="url(#glow-sky)" />
              <rect x="274.68" y="211" width="7" height="9" rx="1.5" fill="#38bdf8" />

    <!-- Grafikkortet -->
    <rect x="107" y="383" width="186" height="54" rx="5" fill="#eceaf0" stroke="#ffffff" stroke-width="1" />
    <rect x="107" y="383" width="186" height="54" rx="5" fill="url(#shade-sky)" />
    <g stroke="#ffffff" stroke-width="1" opacity="0.6">
      <line x1="137" y1="397" x2="129" y2="425" /><line x1="155" y1="397" x2="147" y2="425" /><line x1="173" y1="397" x2="165" y2="425" /><line x1="191" y1="397" x2="183" y2="425" /><line x1="209" y1="397" x2="201" y2="425" /><line x1="227" y1="397" x2="219" y2="425" /><line x1="245" y1="397" x2="237" y2="425" /><line x1="263" y1="397" x2="255" y2="425" />
    </g>
    <rect x="117" y="385" width="128" height="4" rx="2" fill="#38bdf8" filter="url(#glow-sky)" />
    <rect x="117" y="385" width="128" height="3" rx="1.5" fill="#38bdf8" />

    <!-- Nätdelskåpan i botten -->
    <rect x="81" y="497" width="248" height="82" fill="#dedbe4" />
    <rect x="81" y="497" width="248" height="2" fill="#ffffff" opacity="0.6" />
    <g fill="#c9c5d1">
      <rect x="229" y="521" width="7" height="38" rx="2" /><rect x="243" y="521" width="7" height="38" rx="2" /><rect x="257" y="521" width="7" height="38" rx="2" /><rect x="271" y="521" width="7" height="38" rx="2" /><rect x="285" y="521" width="7" height="38" rx="2" /><rect x="299" y="521" width="7" height="38" rx="2" />
    </g>
    <rect x="111" y="535" width="90" height="3" rx="1.5" fill="#38bdf8" opacity="0.9" />

    <!-- Ljuset nedifrån som slår upp mot komponenterna -->
    <rect x="81" y="161" width="248" height="418" fill="url(#ambient-sky)" opacity="0.6" />

    <!-- Glaset -->
    <rect x="81" y="161" width="248" height="418" fill="url(#glass-sky)" />
  </g>

  <!-- En svag ljus kant runt hela chassit, så ett svart chassi inte
       försvinner mot en mörk sida. -->
  <rect x="70.5" y="150.5" width="269" height="439" rx="5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  <path d="M70 150 L180 86 L450 86 L450 526" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />

  <!-- Hörnstolpen mellan sida och front -->
  <rect x="335" y="150" width="9" height="440" fill="#f7f6fa" />
  <rect x="70" y="150" width="270" height="3" fill="#f7f6fa" opacity="0.8" />
</svg>
