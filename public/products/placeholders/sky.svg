<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 74 408 540" width="408" height="540">
  <defs>
    <filter id="glow-sky" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="soft-sky" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <radialGradient id="fanfill-sky">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="0.7" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="1" stop-color="#0b0a0f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-sky" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="shade-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity="0.35" />
    </linearGradient>
    <clipPath id="window-sky">
      <rect x="81" y="161" width="248" height="418" rx="4" />
    </clipPath>
    <pattern id="mesh-sky" width="7" height="7" patternUnits="userSpaceOnUse">
           <rect width="7" height="7" fill="#d6d3dd" />
           <circle cx="3.5" cy="3.5" r="1.6" fill="#bdb9c6" />
         </pattern>
  </defs>

  <!-- Fötter -->
  <rect x="88" y="588" width="46" height="12" rx="3" fill="#b9b5c2" />
  <rect x="276" y="588" width="46" height="12" rx="3" fill="#b9b5c2" />
  <g transform="matrix(1 -0.5818 0 1 340 150)">
    <rect x="70" y="438" width="32" height="12" rx="3" fill="#b9b5c2" />
  </g>

  <!-- Taket -->
