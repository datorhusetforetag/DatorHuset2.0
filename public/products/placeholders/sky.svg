    <rect x="0" y="0" width="270" height="110" fill="#f1eff5" />
    <rect x="30" y="22" width="210" height="66" rx="6" fill="#d9d6df" />
    <g stroke="#c7c3cf" stroke-width="3">
      <line x1="42" y1="28" x2="42" y2="80" /><line x1="68" y1="28" x2="68" y2="80" /><line x1="94" y1="28" x2="94" y2="80" /><line x1="120" y1="28" x2="120" y2="80" /><line x1="146" y1="28" x2="146" y2="80" /><line x1="172" y1="28" x2="172" y2="80" /><line x1="198" y1="28" x2="198" y2="80" /><line x1="224" y1="28" x2="224" y2="80" />
    </g>
