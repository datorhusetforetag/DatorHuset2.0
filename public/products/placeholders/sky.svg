    <rect x="0" y="0" width="7" height="440" fill="#f7f6fa" opacity="0.9" />
    <rect x="104" y="0" width="6" height="440" fill="#e7e4ec" />
  </g>

  <!-- Sidan: ram -->
  <rect x="70" y="150" width="270" height="440" rx="5" fill="#e7e4ec" />

